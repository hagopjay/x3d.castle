name: docker
on:
  push:
    branches: [main]
    paths: ["castle-convert/**", "castle-render/**", "tools/**", "docker/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["castle-convert/**", "castle-render/**", "tools/**", "docker/**", ".github/workflows/docker.yml"]
  workflow_dispatch:
jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (downloads the pinned Castle bundle, builds the exporter and castle-render)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: x3d-castle:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (converter, viewer, castle-render under Xvfb)
        run: docker run --rm x3d-castle:ci
